name: Build Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（默认当天日期 YYYYMMDD）'
        required: false
        default: ''

env:
  IMAGE_NAME: karthrand/ubuntu-ai
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建测试镜像 (amd64)
        run: docker build -t ubuntu-ai:test .

      - name: 测试镜像
        run: |
          echo "===== 验证 Node.js ====="
          docker run --rm ubuntu-ai:test node --version
          docker run --rm ubuntu-ai:test npm --version

          echo "===== 验证 AI CLI 工具 ====="
          docker run --rm ubuntu-ai:test opencode --version

          echo "===== 验证 opencode 静态配置（权限 + MCP 清单）====="
          docker run --rm ubuntu-ai:test jq '{permission, mcp: (.mcp | keys)}' /root/.config/opencode/opencode.json

          echo "===== 验证预装 skill（remote / search-web）====="
          docker run --rm ubuntu-ai:test bash -c 'ls /root/.agents/skills/ && test -f /root/.agents/skills/remote/SKILL.md && test -f /root/.agents/skills/search-web/SKILL.md'

          echo "===== 验证配置脚本（ZAI 模式干跑 + MCP 注入）====="
          docker run --rm -e ZAI_API_KEY=dummy-zai-key -e GLM_MCP_TOKEN=dummy-mcp-token ubuntu-ai:test bash -c '
            ${ENV_SCRIPT_PATH}/configure-opencode.sh &&
            jq . /root/.local/share/opencode/auth.json &&
            jq "{model, mcp_keys: (.mcp | keys), mcp_env: .mcp[\"zai-mcp-server\"].environment}" /root/.config/opencode/opencode.json &&
            cat /etc/profile.d/ai-env.sh'

          echo "===== 验证配置脚本（全量组合干跑：custom + deepseek + EXA + CONTEXT7）====="
          docker run --rm \
            -e OPENCODE_CUSTOM_BASE_URL=https://api.example.com/v1 \
            -e OPENCODE_CUSTOM_API_KEY=dummy-custom-key \
            -e OPENCODE_CUSTOM_MODEL=test-model \
            -e DEEPSEEK_API_KEY=dummy-deepseek-key \
            -e EXA_API_KEY=dummy-exa-key \
            -e CONTEXT7_API_KEY=dummy-ctx7-key \
            -e OPENCODE_MODEL=custom/test-model \
            ubuntu-ai:test bash -c '
            ${ENV_SCRIPT_PATH}/configure-opencode.sh &&
            jq "{model, providers: (.provider | keys), mcp_keys: (.mcp | keys), ctx7_cmd: .mcp.context7.command, exa_url: .mcp.exa.url}" /root/.config/opencode/opencode.json &&
            jq "keys" /root/.local/share/opencode/auth.json'

          echo "===== 验证配置脚本（空配置不报错）====="
          docker run --rm ubuntu-ai:test bash -c '${ENV_SCRIPT_PATH}/configure-opencode.sh'

          echo "===== 验证 SSH 配置 ====="
          docker run --rm ubuntu-ai:test grep '^Port' /etc/ssh/sshd_config

          echo "===== 验证继承（Python/uv/git/jq）====="
          docker run --rm ubuntu-ai:test python3 --version
          docker run --rm ubuntu-ai:test uv --version
          docker run --rm ubuntu-ai:test git --version
          docker run --rm ubuntu-ai:test jq --version

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 推送到 Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推送到阿里云
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mirror-to-gitlab:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 诊断 GitLab 连通性
        run: |
          echo "===== DNS 解析 ====="
          nslookup gitlab.karthrand.cn || true
          echo "===== 端口连通性测试 ====="
          curl -v --connect-timeout 10 https://gitlab.karthrand.cn:6443/ 2>&1 || true

      - name: 推送到 GitLab
        env:
          GITLAB_USER: ${{ secrets.GITLAB_USER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://gitlab.karthrand.cn:6443/private/ubuntu-ai.git
          git config --global credential.helper '!f() { if test "$1" = get; then echo "protocol=https"; echo "host=gitlab.karthrand.cn"; echo "port=6443"; echo "username=$GITLAB_USER"; echo "password=$GITLAB_TOKEN"; fi; }; f'
          git push gitlab --all --force
